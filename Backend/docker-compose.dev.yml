version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deptconnekt-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - MONGO_URI_PROD=mongodb://mongo:27017/deptconnekt
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - deptconnekt-network

  mongo:
    image: mongo:7
    container_name: deptconnekt-mongo
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - deptconnekt-network

volumes:
  mongo-data:

networks:
  deptconnekt-network:
    driver: bridge
